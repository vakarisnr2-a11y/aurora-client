# Gradle performance: keep the build well under a few minutes after the first Minecraft download.
org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Fabric / Minecraft versions (verified against meta.fabricmc.net)
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.14
loom_version=1.10.5
fabric_version=0.116.17+1.21.1

# Mod
mod_version=1.0.0
maven_group=dev.aurora
archives_base_name=aurora-client

# Slow-network tolerance for dependency downloads
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
